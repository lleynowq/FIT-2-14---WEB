<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Пошук інтернет-провайдерів за адресою та характеристиками підключення.">
  <title>ISPCheck — Мапа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body class="map-page">
  <main class="map-layout">
    <aside class="map-sidebar" aria-label="Навігація та пошук оператора">
      <a class="map-brand" href="index.html">ISPCheck</a>
      <div class="provider-search map-provider-search" data-provider-search data-provider-search-mode="map">
        <form class="header-search" role="search" action="map.html" method="get">
          <label class="visually-hidden" for="map-provider-search">Знайти оператора</label>
          <input id="map-provider-search" type="search" name="q" placeholder="Знайти оператора"
            autocomplete="off" data-provider-input aria-autocomplete="list"
            aria-expanded="false" aria-controls="map-provider-search-results">
          <button class="search-submit" type="submit" aria-label="Знайти оператора">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>
          </button>
        </form>
        <div class="search-results" id="map-provider-search-results" data-provider-results role="listbox" hidden></div>
      </div>
      <p class="map-sidebar-hint">Оберіть оператора для перегляду його пропозицій або скористайтеся пошуком за адресою на правій панелі.</p>
      <a class="header-pill sidebar-report" href="#">
        <span class="icon-info" aria-hidden="true">i</span>
        <span>Повідомити про помилку</span>
      </a>
    </aside>

    <section class="map-canvas" id="provider-map" aria-label="Інтерактивна мапа покриття операторів"></section>

    <aside class="provider-panel" aria-label="Пошук адреси, фільтри та результати">
      <section class="panel-address-section" aria-labelledby="address-title">
        <h2 id="address-title">Пошук за адресою</h2>
        <form class="address-search" id="address-search-form" autocomplete="off">
          <div class="address-control" data-address-control="city">
            <label class="visually-hidden" for="city">Місто</label>
            <div class="field-with-icon">
              <input id="city" name="city" type="search" placeholder="Місто" data-address-input="city"
                aria-autocomplete="list" aria-expanded="false" aria-controls="city-suggestions">
              <button type="button" aria-label="Підказки міст" class="field-search-icon" data-address-focus="city">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>
              </button>
            </div>
            <div class="address-suggestions" id="city-suggestions" data-address-results="city" role="listbox" hidden></div>
          </div>

          <div class="address-control" data-address-control="street">
            <label class="visually-hidden" for="street">Вулиця</label>
            <div class="field-with-icon">
              <input id="street" name="street" type="search" placeholder="Вулиця" data-address-input="street"
                aria-autocomplete="list" aria-expanded="false" aria-controls="street-suggestions" disabled>
              <button type="button" aria-label="Підказки вулиць" class="field-search-icon" data-address-focus="street" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>
              </button>
            </div>
            <div class="address-suggestions" id="street-suggestions" data-address-results="street" role="listbox" hidden></div>
          </div>

          <div class="address-row">
            <div class="address-control building-field" data-address-control="building">
              <label class="visually-hidden" for="building">Номер будинку</label>
              <div class="field-with-icon">
                <input id="building" name="building" type="search" placeholder="№ буд." data-address-input="building"
                  aria-autocomplete="list" aria-expanded="false" aria-controls="building-suggestions" disabled>
                <button type="button" aria-label="Підказки будинків" class="field-search-icon" data-address-focus="building" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"></circle><path d="m16 16 4.2 4.2"></path></svg>
                </button>
              </div>
              <div class="address-suggestions" id="building-suggestions" data-address-results="building" role="listbox" hidden></div>
            </div>
            <label class="visually-hidden" for="entrance">Під'їзд</label>
            <select id="entrance" name="entrance" disabled aria-label="Під'їзд">
              <option value="">Під'їзд</option>
            </select>
          </div>
          <button class="address-submit" type="submit">Знайти за адресою</button>
          <p class="address-message" id="address-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="filters" aria-labelledby="filters-title">
        <h2 id="filters-title">Фільтри</h2>
        <label class="visually-hidden" for="technology">Технологія мережі</label>
        <select id="technology" name="technology">
          <option value="">Технологія мережі</option>
        </select>
        <label class="visually-hidden" for="speed">Мінімальна швидкість підключення</label>
        <select id="speed" name="speed">
          <option value="">Швидкість підключення</option>
        </select>
        <label class="energy-option">
          <input type="checkbox" name="energy-independent" id="energy-independent">
          <span>Енергонезалежний</span>
        </label>
      </section>

      <section class="results-section" aria-labelledby="providers-title">
        <h2 id="providers-title">Результати пошуку</h2>
        <p class="result-status" id="results-status" data-state="idle" role="status" aria-live="polite">
          Введіть адресу або назву оператора, щоб знайти доступні пропозиції.
        </p>
        <ul class="provider-list" id="provider-results"></ul>
      </section>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="js/site.js" defer></script>
  <script src="js/map.js" defer></script>
</body>
</html>
